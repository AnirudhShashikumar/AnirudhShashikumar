 838 115 895 148" stroke="var(--cyan)" fill="none" pathLength="100" stroke-width="2.2" class="packet"/><path d="M668 195 722 218 774 149 839 210 895 148" stroke="var(--violet)" fill="none" pathLength="100" stroke-width="2.2" class="packet reply"/><circle cx="657" cy="107" r="3.2" fill="var(--cyan)" class="node"/><circle cx="717" cy="83" r="3.2" fill="var(--cyan)" class="node late"/><circle cx="774" cy="149" r="4" fill="var(--cyan)" class="node"/><circle cx="838" cy="115" r="3.2" fill="var(--cyan)" class="node late"/><circle cx="895" cy="148" r="3.2" fill="var(--cyan)" class="node"/><circle cx="668" cy="195" r="3.2" fill="var(--blue)" class="node late"/><circle cx="722" cy="218" r="3.2" fill="var(--blue)" class="node"/><circle cx="839" cy="210" r="3.2" fill="var(--blue)" class="node late"/><circle cx="720" cy="149" r="3.2" fill="var(--blue)" class="node"/><circle cx="774" cy="149" r="18" fill="var(--inset)" stroke="var(--cyan)"/><path d="M766 149h16M774 141v16" stroke="var(--cyan)" fill="none" stroke-width="1.5"/><text x="646" y="66" font-family="ui-monospace,Consolas,monospace" font-size="10" font-weight="400" fill="var(--muted)">INPUT</text><text x="906" y="234" font-family="ui-monospace,Consolas,monospace" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="end">INFERENCE</text><path d="M661 68v177" stroke="var(--cyan)" fill="none" stroke-opacity="0.17" class="scanner"/></g><path d="M34 267H926" stroke="var(--border)" fill="none"/><text x="34" y="298" font-family="ui-monospace,Consolas,monospace" font-size="10" font-weight="400" fill="var(--muted)">01</text><text x="58" y="298" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="400" fill="var(--cyan)" letter-spacing="0.6">OBSERVE</text><path d="M152 294h14" stroke="var(--trace)" fill="none"/><text x="182" y="298" font-family="ui-monospace,Consolas,monospace" font-size="10" font-weight="400" fill="var(--muted)">02</text><text x="206" y="298" font-family="ui-monospace,Consolas,mo