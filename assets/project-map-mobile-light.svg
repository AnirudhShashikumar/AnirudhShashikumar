<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">Project constellation: four systems, one engineering practice.</title><desc id="desc">SatQuery AI connects research and remote sensing; MediFit connects AI and health interfaces; Gesture Globe connects vision and interaction; Dayflow connects backend and product engineering. This is a conceptual map, not an expertise score.</desc>
<defs></defs>
<style>:root{--bg:#f5f8fc;--panel:#eaf1f7;--inset:#ffffff;--ink:#142a42;--muted:#506982;--border:#bdcddd;--grid:#d3e0eb;--cyan:#006f80;--blue:#245fae;--violet:#7151aa;--trace:#8aa6bc;}
.packet{stroke-dasharray:2 98;stroke-dashoffset:100;animation:packet 16s linear infinite}
.reply{animation-delay:-8s;stroke:var(--violet)}
.node{animation:node 8s ease-in-out infinite}.late{animation-delay:-3s}
@keyframes packet{0%,12%{stroke-dashoffset:100;opacity:0}18%{opacity:1}65%{stroke-dashoffset:0;opacity:1}75%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes node{0%,100%{opacity:.45}45%,60%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="479" height="339" rx="16" fill="var(--bg)" stroke="var(--border)"/><path d="M123.0 102Q240 102 240 170" stroke="var(--trace)" fill="none"/><path d="M123.0 102Q240 102 240 170" stroke="var(--cyan)" fill="none" pathLength="100" stroke-width="1.6" class="packet"/><path d="M357.0 102Q240 102 240 170" stroke="var(--trace)" fill="none"/><path d="M357.0 102Q240 102 240 170" stroke="var(--violet)" fill="none" pathLength="100" stroke-width="1.6" class="packet reply"/><path d="M123.0 238Q240 238 240 170" stroke="var(--trace)" fill="none"/><path d="M357.0 238Q240 238 240 170" stroke="var(--trace)" fill="none"/><circle cx="240" cy="170" r="25" fill="var(--panel)" stroke="var(--cyan)" stroke-width="1"/><text x="240" y="175" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="400" fill="var(--cyan)" text-anchor="middle">R → P</text><rect x="16" y="18" width="214" height="84" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="30" y="41" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--cyan)">01</text><text x="59" y="48" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="var(--ink)">SatQuery AI</text><text x="30" y="79" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="var(--muted)">Remote sensing</text><rect x="250" y="18" width="214" height="84" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="264" y="41" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--cyan)">03</text><text x="293" y="48" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="var(--ink)">MediFit</text><text x="264" y="79" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="var(--muted)">Applied AI</text><rect x="16" y="238" width="214" height="84" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="30" y="261" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--cyan)">04</text><text x="59" y="268" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="var(--ink)">Gesture Globe</text><text x="30" y="299" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="var(--muted)">Vision × interaction</text><rect x="250" y="238" width="214" height="84" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="264" y="261" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--cyan)">02</text><text x="293" y="268" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="var(--ink)">Dayflow</text><text x="264" y="299" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="var(--muted)">Full-stack systems</text>
