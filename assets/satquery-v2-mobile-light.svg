</text><path d="M58 231v10" stroke="var(--trace)" fill="none"/><path d="M58 231v10" stroke="var(--cyan)" fill="none" pathLength="100" stroke-width="2" class="packet"/><rect x="24" y="242" width="432" height="62" rx="8" fill="var(--panel)" stroke="var(--border)"/><rect x="34" y="249" width="48" height="48" rx="4" fill="var(--inset)" stroke="var(--trace)"/><path d="M41 265v-8h9m17 0h8v8m0 17v8h-8m-17 0H41v-8" stroke="var(--cyan)" fill="none" stroke-width="1.4"/><path d="M49 274l7 7 13-17" stroke="var(--cyan)" fill="none" stroke-width="1.5"/><text x="98" y="265" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="400" fill="var(--cyan)">03 / INVESTIGATE</text><text x="98" y="290" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="var(--ink)">Spatial evidence</text>
