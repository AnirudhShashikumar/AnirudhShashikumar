<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
<title id="title">Anirudh Shashikumar — Engineering the Next Era of AI.</title><desc id="desc">Research to production: observe, reason, build, validate, deploy. AI / ML, computer vision, full-stack, research. Decorative intelligence network; no live-status claims.</desc>
<defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="var(--grid)" stroke-opacity=".35" stroke-width=".5"/></pattern></defs>
<style>:root{--bg:#09121e;--panel:#101f30;--inset:#0c1927;--ink:#eff5fb;--muted:#a4b8cc;--border:#30465d;--grid:#20374e;--cyan:#71e3e5;--blue:#88b5ff;--violet:#b6a8f5;--trace:#456b89;}
.packet{stroke-dasharray:2 98;stroke-dashoffset:100;animation:packet 16s linear infinite}
.reply{animation-delay:-8s;stroke:var(--violet)}
.node{animation:node 8s ease-in-out infinite}.late{animation-delay:-3s}
@keyframes packet{0%,12%{stroke-dashoffset:100;opacity:0}18%{opacity:1}65%{stroke-dashoffset:0;opacity:1}75%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes node{0%,100%{opacity:.45}45%,60%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="479" height="359" rx="16" fill="var(--bg)" stroke="var(--border)"/><rect x="1" y="1" width="478" height="358" rx="15" fill="url(#grid)" stroke="none"/><path d="M28 30h10v10h10v-10h10" stroke="var(--cyan)" fill="none" stroke-width="2"/><text x="70" y="39" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="400" fill="var(--muted)" letter-spacing="1.3">RESEARCH → PRODUCTION</text><text x="26" y="105" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" fill="var(--ink)" letter-spacing="-1">ANIRUDH</text><text x="26" y="154" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" fill="var(--ink)" letter-spacing="-1">SHASHIKUMAR</text><text x="28" y="194" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="var(--cyan)">Engineering the Next Era of AI.</text><text x="28" y="234" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="400" fill="var(--muted)">AI / ML · COMPUTER VISION</text><text x="28" y="260" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="400" fill="var(--muted)">FULL-STACK · RESEARCH</text><path d="M28 282H452" stroke="var(--border)" fill="none"/><text x="28" y="310" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="400" fill="var(--cyan)">OBSERVE → REASON → BUILD</text><text x="28" y="337" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="400" fill="var(--muted)">VALIDATE → DEPLOY</text><text x="452" y="337" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--muted)" text-anchor="end">BENGALURU</text><path d="M379 32 409 53 450 26 446 81 390 85 409 53" stroke="var(--trace)" fill="none" stroke-opacity="0.6"/><path d="M379 32 409 53 450 26 446 81 390 85 409 53" stroke="var(--cyan)" fill="none" pathLength="100" stroke-width="2" class="packet"/><circle cx="379" cy="32" r="2.6" fill="var(--cyan)" class="node"/><circle cx="409" cy="53" r="2.6" fill="var(--cyan)" class="node late"/><circle cx="450" cy="26" r="2.6" fill="var(--cyan)" class="node"/><circle cx="446" cy="81" r="2.6" fill="var(--cyan)" class="node late"/><circle cx="390" cy="85" r="2.6" fill="var(--cyan)" class="node"/>
</svg>
