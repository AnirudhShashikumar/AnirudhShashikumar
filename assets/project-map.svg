<svg xmlns="http://www.w3.org/2000/svg" width="960" height="268" viewBox="0 0 960 268" role="img" aria-labelledby="title desc">
<title id="title">Project constellation: four systems, one engineering practice.</title><desc id="desc">SatQuery AI connects research and remote sensing; MediFit connects AI and health interfaces; Gesture Globe connects vision and interaction; Dayflow connects backend and product engineering. This is a conceptual map, not an expertise score.</desc>
<defs></defs>
<style>:root{--bg:#09121e;--panel:#101f30;--inset:#0c1927;--ink:#eff5fb;--muted:#a4b8cc;--border:#30465d;--grid:#20374e;--cyan:#71e3e5;--blue:#88b5ff;--violet:#b6a8f5;--trace:#456b89;}
.packet{stroke-dasharray:2 98;stroke-dashoffset:100;animation:packet 16s linear infinite}
.reply{animation-delay:-8s;stroke:var(--violet)}
.node{animation:node 8s ease-in-out infinite}.late{animation-delay:-3s}
@keyframes packet{0%,12%{stroke-dashoffset:100;opacity:0}18%{opacity:1}65%{stroke-dashoffset:0;opacity:1}75%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes node{0%,100%{opacity:.45}45%,60%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="959" height="267" rx="16" fill="var(--bg)" stroke="var(--border)"/><path d="M312 67.0Q480 67.0 480 134" stroke="var(--trace)" fill="none"/><path d="M312 67.0Q480 67.0 480 134" stroke="var(--cyan)" fill="none" pathLength="100" stroke-width="1.6" class="packet"/><path d="M648 67.0Q480 67.0 480 134" stroke="var(--trace)" fill="none"/><path d="M648 67.0Q480 67.0 480 134" stroke="var(--violet)" fill="none" pathLength="100" stroke-width="1.6" class="packet reply"/><path d="M312 201.0Q480 201.0 480 134" stroke="var(--trace)" fill="none"/><path d="M648 201.0Q480 201.0 480 134" stroke="var(--trace)" fill="none"/><circle cx="480" cy="134" r="33" fill="var(--panel)" stroke="var(--cyan)" stroke-width="1"/><text x="480" y="139" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="400" fill="var(--cyan)" text-anchor="middle">R → P</text><text x="480" y="43" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--muted)" text-anchor="middle">RESEARCH + AI</text><text x="480" y="236" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--muted)" text-anchor="middle">INTERACTION + SYSTEMS</text><rect x="28" y="26" width="284" height="82" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="42" y="49" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--cyan)">01</text><text x="71" y="56" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="var(--ink)">SatQuery AI</text><text x="42" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="var(--muted)">Remote sensing intelligence</text><rect x="648" y="26" width="284" height="82" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="662" y="49" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--cyan)">03</text><text x="691" y="56" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="var(--ink)">MediFit</text><text x="662" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="var(--muted)">Applied AI / health insights</text><rect x="28" y="160" width="284" height="82" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="42" y="183" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--cyan)">04</text><text x="71" y="190" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="var(--ink)">Gesture Globe</text><text x="42" y="221" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="var(--muted)">Vision × interaction</text><rect x="648" y="160" width="284" height="82" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="662" y="183" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="var(--cyan)">02</text><text x="691" y="190" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="var(--ink)">Dayflow</text><text x="662" y="221" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="var(--muted)">Full-stack systems</text>
